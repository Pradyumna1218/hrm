<h1 class="text-primary text-center">{{ header }}</h1>
<br>

<div class="container">
    <!-- One way binding -->
    <!-- String Interpolation -->
    <span>{{ secondTitle }}</span>
    <hr>
    <!-- One way binding -->
    <input type="checkbox" id="TestCheckbox" [(checked)]="isChecked">
    <label for="TestCheckbox">First Checkbox</label>
    <br>
    <!-- Two way binding -->
    <input type="checkbox" id="TestCheckbox2" #xyz [(ngModel)]="isChecked">
    <label for="TestCheckbox2">Second Checkbox</label>
    <br>
    <!-- Two way binding -- Template Referencing-->
    <!-- <input type="checkbox" id="TestCheckbox2" #TestCheckboxTemp 
    (change)="changeCheckbox(TestCheckboxTemp.checked)"> -->
    <label for="TestCheckbox2">Second Checkbox</label>
    <br>
    {{ isChecked }}
    <br>

    <input type="text" [value] = "isChecked" (input) = "changeCheckbox()">
</div>

<div class="container">
    <app-home [parentValue]="isChecked" 
    (childEvent)="handleChildEvent($event)"
    >
        
    </app-home>
</div>

<p class = "text-center"> End of line </p>
