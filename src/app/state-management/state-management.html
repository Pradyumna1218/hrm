<div class="container">
    <h3>Property Way (Manual management)</h3>
    <br>
    <input type = "text" [(ngModel)] = "name">
    <br>
    Name: {{ name }}
    <br>
    Display Name: {{ displayName }}
    <br>
    <button (click) = "changeDisplayName()" class = "btn btn-primary">
        Change displayName
    </button>

</div>
<div class="container">
    <h3>Signal Way (Angular's new way)</h3>
    <br>
    <input type = "text" [(ngModel)] = "nameSignal">
    <br>
    Name: {{ nameSignal() }}
    <br>
    Display Name: {{ displayNameSignal() }}
    <br>
</div>
<br>
<div class="container">
    <h3>Industry Way</h3>
    <br>
    <input type = "text" [(ngModel)] = "nameSignal">
    <br>
    Name: {{ nameSignal() }}
    <br>
    Display Name: {{ displayNameSignal() }}
    <br>
</div>
